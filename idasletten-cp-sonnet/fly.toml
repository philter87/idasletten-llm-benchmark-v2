app = "idasletten-cp-sonnet"
primary_region = "ams"

[build]

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  DATABASE_PATH = "/data/idasletten.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "idasletten_data"
  destination = "/data"
