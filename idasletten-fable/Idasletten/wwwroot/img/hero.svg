<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9c8"/>
      <stop offset="0.5" stop-color="#f6c489"/>
      <stop offset="1" stop-color="#e8875e"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a63a2a"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a37c"/>
      <stop offset="1" stop-color="#9c6b4f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <circle cx="600" cy="180" r="90" fill="#fff3d6" opacity="0.9"/>
  <circle cx="600" cy="180" r="130" fill="#fff3d6" opacity="0.35"/>

  <!-- Mountains -->
  <path d="M0 230 L140 120 L260 230 Z" fill="url(#mountain)" opacity="0.75"/>
  <path d="M180 230 L330 90 L480 230 Z" fill="url(#mountain)" opacity="0.6"/>
  <path d="M720 230 L880 100 L1040 230 Z" fill="url(#mountain)" opacity="0.6"/>
  <path d="M960 230 L1090 130 L1200 230 Z" fill="url(#mountain)" opacity="0.75"/>

  <!-- Valhalla -->
  <g fill="#5b3a29">
    <path d="M600 78 L500 130 L700 130 Z"/>
    <rect x="512" y="130" width="176" height="100"/>
    <g fill="#3f2a20">
      <rect x="528" y="146" width="16" height="84"/>
      <rect x="560" y="146" width="16" height="84"/>
      <rect x="592" y="146" width="16" height="84"/>
      <rect x="624" y="146" width="16" height="84"/>
      <rect x="656" y="146" width="16" height="84"/>
    </g>
    <path d="M596 60 L604 60 L604 78 L596 78 Z"/>
    <path d="M585 52 L615 52 L615 60 L585 60 Z"/>
  </g>

  <!-- The red plain of Idasletten -->
  <rect y="230" width="1200" height="170" fill="url(#plain)"/>
  <ellipse cx="300" cy="300" rx="180" ry="14" fill="#6d1212" opacity="0.7"/>
  <ellipse cx="880" cy="330" rx="220" ry="16" fill="#6d1212" opacity="0.7"/>

  <!-- Fighting einherjer silhouettes -->
  <g fill="#2d1510">
    <!-- warrior with raised sword -->
    <g transform="translate(250 250)">
      <circle cx="0" cy="-38" r="9"/>
      <path d="M-6 -30 L6 -30 L9 6 L4 6 L2 -8 L-2 -8 L-4 6 L-9 6 Z"/>
      <path d="M4 -26 L26 -44 L28 -41 L8 -22 Z"/>
      <path d="M26 -44 L38 -56 L40 -53 L28 -41 Z" fill="#4a2c1f"/>
      <path d="M-4 -26 L-18 -18 L-16 -14 L-3 -21 Z"/>
      <circle cx="-20" cy="-16" r="7" fill="#4a2c1f"/>
    </g>
    <!-- opposing warrior with axe -->
    <g transform="translate(320 252) scale(-1 1)">
      <circle cx="0" cy="-38" r="9"/>
      <path d="M-6 -30 L6 -30 L9 6 L4 6 L2 -8 L-2 -8 L-4 6 L-9 6 Z"/>
      <path d="M4 -26 L24 -48 L27 -45 L8 -22 Z"/>
      <path d="M22 -52 L32 -44 L26 -38 L18 -46 Z" fill="#4a2c1f"/>
    </g>
    <!-- spearman -->
    <g transform="translate(900 268)">
      <circle cx="0" cy="-38" r="9"/>
      <path d="M-6 -30 L6 -30 L9 6 L4 6 L2 -8 L-2 -8 L-4 6 L-9 6 Z"/>
      <path d="M-2 -24 L46 -58 L48 -55 L1 -20 Z"/>
      <path d="M46 -58 L54 -66 L58 -60 L50 -55 Z" fill="#4a2c1f"/>
    </g>
    <!-- shieldmaiden -->
    <g transform="translate(966 270) scale(-1 1)">
      <circle cx="0" cy="-38" r="9"/>
      <path d="M-6 -30 L6 -30 L9 6 L4 6 L2 -8 L-2 -8 L-4 6 L-9 6 Z"/>
      <circle cx="14" cy="-22" r="12" fill="#4a2c1f"/>
      <circle cx="14" cy="-22" r="4"/>
    </g>
    <!-- fallen shield and sword -->
    <ellipse cx="600" cy="330" rx="20" ry="6" opacity="0.9"/>
    <path d="M560 322 L596 334 L595 338 L559 326 Z" opacity="0.85"/>
  </g>

  <!-- Ravens -->
  <g stroke="#3f2a20" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M150 70 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M1010 60 q9 -11 18 0 q9 -11 18 0"/>
  </g>
</svg>
