# Fly.io configuration. The app name is the folder name, as the build conventions ask for.
app = "idasletten-opus5"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_HTTP_PORTS = "8080"
  # The SQLite file lives on the mounted volume, so results survive a deploy.
  ConnectionStrings__Idasletten = "Data Source=/data/idasletten.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# One machine only: SQLite on a volume cannot be shared between machines.
[[mounts]]
  source = "idasletten_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
