app = "idasletten-cp-opus48"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "idasletten_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ConnectionStrings__DefaultConnection = "DataSource=/data/idasletten.db"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
