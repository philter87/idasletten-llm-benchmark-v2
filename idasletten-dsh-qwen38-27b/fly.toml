# Fly.io configuration — Idasletten
# App name follows the deployment convention: the folder name.
app = "idasletten"
primary_region = "osl"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "idasletten_data"
  destination = "/data"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://127.0.0.1:8080"
  Database__Mode = "File"
  Database__Path = "/data/idasletten.db"
